<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Chama e Essência</title>
  <script>
    // Aplica o tema salvo (ou o do sistema) antes de desenhar a tela, sem "piscar".
    (function () {
      var t = null;
      try { t = localStorage.getItem('ce.theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&family=Urbanist:wght@400;500;600&display=swap">
  <base href="/">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="theme-color" content="#722536">
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

</body>
</html>
